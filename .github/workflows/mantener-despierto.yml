name: Mantener el servidor despierto
"on":
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al servidor
        run: |
          echo "Haciendo ping a VotoTech..."
          curl -sf -o /dev/null -w "Respuesta: %{http_code} en %{time_total}s\n" https://vototech-backend.onrender.com/ || echo "⚠️ El ping falló"
5
