name: Mantener el servidor despierto

# Corre solo, cada 10 minutos, sin que nadie tenga que hacer nada —
# Render duerme el servicio gratuito tras 15 minutos sin actividad,
# así que un ping cada 10 minutos evita que llegue a dormirse.
#
# Apunta a /api/salud (una respuesta chiquita de JSON) en vez de la
# raíz "/" — desde que la raíz empezó a servir la página de ventas
# completa, pegarle ahí cada 10 minutos descargaba todo el HTML de
# la home de balde. /api/salud hace exactamente lo mismo (mantiene
# el proceso despierto) pesando una fracción de eso.
#
# No necesita ninguna cuenta externa (UptimeRobot, cron-job.org,
# etc.) — vive directo en tu repositorio de GitHub, gratis.

"on":
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # también se puede correr manual desde GitHub, para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al servidor
        run: |
          echo "Haciendo ping a VotoTech..."
          curl -sf -o /dev/null -w "Respuesta: %{http_code} en %{time_total}s\n" https://vototech-backend.onrender.com/api/salud || echo "⚠️ El ping falló — revisa si la URL sigue siendo correcta o si el servicio está caído"
