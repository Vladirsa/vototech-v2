version: "3.9"

# Levanta TODO el entorno de desarrollo con un solo comando:
#   docker compose up
# Antes de esto tuvimos que instalar PostgreSQL a mano, crear la base,
# configurar usuarios, etc. — con esto cualquiera (incluyendo Vlado)
# puede tener el proyecto corriendo en su máquina en minutos, sin
# repetir esa fricción.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vototech_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: votodev123
    ports:
      - "5432:5432"
    volumes:
      - vototech_db_data:/var/lib/postgresql/data
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vototech_dev
      DB_USER: postgres
      DB_PASSWORD: votodev123
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      SUPER_ADMIN_KEY: ${SUPER_ADMIN_KEY:-dev-admin-key}
      PORT: 4000
      # Estas son opcionales para desarrollo básico — sin ellas,
      # simplemente esas funciones específicas (IA, WhatsApp, fotos,
      # push) no van a funcionar, pero el resto del sistema sí.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  vototech_db_data:
